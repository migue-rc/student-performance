project:
  type: website

website:
  favicon: favicon.ico
  site-url: "https://migue-rc.github.io/student-performance"
  description: "Multivariate analysis of student performance factors with an interactive score predictor."
  open-graph: true
  twitter-card: true
  image: "student_performance_preview.gif"
  # Creates a top navbar so users can always get back to your Hub
  navbar:
    left:
      - text: "← Back to Main"
        href: "https://migue-rc.github.io"
      - href: 01_data_preparation.qmd
        text: "Data Prep"
      - href: 02_eda.qmd
        text: "EDA"
      - href: 03_modeling.qmd
        text: "Modeling"
      - href: 04_conclusions.qmd
        text: "Conclusions"

# Engine configuration (Moved out of format block)
execute:
  warning: false
  freeze: auto # cache computations so style-only republishes need no Python env # Hides Python deprecation/info warnings in the final output

format:
  html:
    # Loads the base theme, then any local SCSS variables
    theme:
      light: [sketchy, sketchy-light.scss, custom.scss]
      dark: [sketchy, sketchy-dark.scss, custom.scss]
    # Injects your live, remote CSS file for instant global updates
    highlight-style: 
      light: github
      dark: monokai
    include-in-header: 
      text: |
        <link rel="stylesheet" href="https://migue-rc.github.io/brand-theme.css">
    css: local-style.css
    toc: true
    code-fold: true
